[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pint-data-attribution"
version = "0.1.0"
description = "Reproducible predicted-noise influence tracing experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = [
  "h5py>=3.8",
  "pandas>=1.5",
  "Pillow>=9.5",
  "scikit-learn>=1.2",
  "tqdm>=4.65",
]

[project.scripts]
pint = "pint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
