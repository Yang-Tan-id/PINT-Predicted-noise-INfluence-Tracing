[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pint-data-attribution"
version = "0.1.0"
description = "Reproducible predicted-noise influence tracing experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = [
  "h5py>=3.8",
  "pandas>=1.5",
  "Pillow>=9.5",
  "scikit-learn>=1.2",
  "tqdm>=4.65",
]
train-x3 = [
  "torch>=2.0.1,<3",
  "tqdm>=4.65",
]
train-jax = [
  "jax[cuda12]>=0.4.20,<0.5",
  "flax>=0.8,<0.11",
  "optax>=0.2,<0.3",
  "tqdm>=4.65",
]
train-artbench = [
  "accelerate==0.20.3",
  "diffusers==0.16.1",
  "huggingface-hub==0.15.1",
  "pandas==1.5.3",
  "Pillow==9.5.0",
  "safetensors==0.3.1",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "tqdm==4.65.0",
  "transformers==4.30.1",
]

[project.scripts]
pint = "pint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
